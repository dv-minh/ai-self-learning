[project]
name = "gen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sympy>=1.13", "numpy>=2.0", "pydantic>=2.8"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
