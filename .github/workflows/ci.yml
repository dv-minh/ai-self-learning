name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with: { package_json_file: site/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: site/pnpm-lock.yaml }
      # Thứ tự theo docs/spec.md mục 2: pytest → sinh kho → schema → Vitest → build
      - name: pytest
        run: if [ -d generator/tests ]; then cd generator && uv run pytest; fi
      - name: Sinh kho bài tập
        run: if [ -f generator/pyproject.toml ]; then cd generator && uv run python -m gen build --all; fi
      - name: Xuất JSON Schema
        run: if [ -f generator/pyproject.toml ]; then cd generator && uv run python -m gen schema; fi
      - run: pnpm --dir site install --frozen-lockfile
      - name: Kiểm tra LaTeX của kho bài bằng KaTeX
        run: pnpm --dir site validate:banks
      - run: pnpm --dir site typecheck
      - run: pnpm --dir site test
      - name: Build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm --dir site build
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
